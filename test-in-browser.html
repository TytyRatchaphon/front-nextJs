<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Notification Tester</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .notifications {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .notification-item {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification-item.new {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .notification-item.read {
            border-left-color: #6b7280;
            background: #f3f4f6;
        }

        .notification-title {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .notification-subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .notification-message {
            color: #4b5563;
            font-size: 13px;
        }

        .notification-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
        }

        .logs {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .log-time {
            color: #6b7280;
        }

        .log-success {
            color: #10b981;
        }

        .log-error {
            color: #ef4444;
        }

        .log-info {
            color: #3b82f6;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-unread {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                🔔 Socket.IO Notification Tester
                <span id="status" class="status disconnected">Disconnected</span>
            </h1>
            <p>Real-time notification testing tool for backend developers</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <h2>Connection Settings</h2>
            <div class="input-group">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" value="http://localhost:3331" placeholder="http://localhost:3331">
            </div>
            <div class="input-group">
                <label for="token">JWT Token:</label>
                <input type="text" id="token" placeholder="Paste your JWT token here"
                    value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoyLCJ1c2VySUQiOiJFSkIyMDI1blhlWjExMjQxNjEzNDQiLCJmdWxsbmFtZSI6IuC4muC4seC4h-C4muC4suC4quC4oeC4suC5geC4peC5ieC4pyIsIndyaXRlcl9uYW1lIjpudWxsLCJwaG9uZSI6IiIsImFkZHJlc3NfbWFpbiI6bnVsbCwiZW1haWwiOiJkZXZiYXNAZ21haWwuY29tIiwicHdzIjoiJDJiJDEwJGZZeHJVRTdENFUvaTFZcVAvVkFtZC5MeHFma01RenZsS1VhR1BkMnlFZ3VDRWoxUHhLZHJDIiwiYmFubmVyIjoiaHR0cHM6Ly9pbWFnZS5lbmpveWJvb2suY28vZW5qb3lib29rLmltYWdlL3Rlc3RtaW5pby91c2VyL2VqYi1iYW5uZXIuanBnIiwiaW1nIjoiaHR0cHM6Ly9pbWFnZS5lbmpveWJvb2suY28vZW5qb3lib29rLmltYWdlL3Rlc3RtaW5pby91c2VyL2VqYi1wcm9maWxlLnBuZyIsImRlcyI6bnVsbCwiZmFjZWJvb2siOm51bGwsInR3aXR0ZXIiOm51bGwsImNvaW4iOiIwLjAwIiwiZnJlZWNvaW4iOiIwLjAwIiwiaGVhcnQiOjAsImZsb3dlciI6MCwiY291cG9uIjoxNSwiZXhwX3BvaW50IjowLCJzdGFtcCI6MCwid2hlZWwiOjAsImZhc3RfdGlja2V0IjowLCJjb2luSW5jb21lIjoiMC4wMCIsImdlbmRlciI6Im5vIiwiYmlydGhkYXkiOm51bGwsInBlcmNlbnQiOjcwLCJwZXJjZW50X2RvbmF0ZSI6NzAsInB1Ymxpc2giOiJhY3RpdmUiLCJyZWdpc3RlckRhdGUiOiIyMDI1LTExLTI0VDA5OjEzOjQ0LjAwMFoiLCJjYXQxIjowLCJjYXQyIjowLCJtYWlsX3N1YiI6InllcyIsImZyYW1lX2lkIjpudWxsLCJha2FfaWQiOm51bGwsImZyYW1lIjpudWxsLCJha2EiOm51bGwsInRvdGFsQm9va3MiOjAsInRvdGFsRm9sbG93ZXJzIjowLCJpYXQiOjE3NjU1MjY5NjN9.qHjrQ-H4JXbetz7JoRWnNqt2WrEyul8TUvDVuCP3BGc">
            </div>
            <div>
                <button class="btn btn-primary" onclick="connect()">🔌 Connect</button>
                <button class="btn btn-danger" onclick="disconnect()">❌ Disconnect</button>
                <button class="btn btn-success" onclick="joinNotifications()">📢 Join Notifications</button>
                <button class="btn btn-secondary" onclick="ping()">🏓 Ping</button>
                <button class="btn btn-secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
                <button class="btn btn-secondary" onclick="clearNotifications()">🗑️ Clear Notifications</button>
            </div>
        </div>

        <!-- Logs -->
        <div class="logs" id="logs">
            <div class="log-entry">
                <span class="log-time">[Ready]</span>
                <span class="log-info">Enter your JWT token and click Connect to start</span>
            </div>
        </div>

        <!-- Notifications -->
        <div class="notifications">
            <h2>
                Notifications
                <span id="unreadBadge" class="badge badge-unread" style="display: none;">0</span>
            </h2>
            <div id="notificationsList">
                <p style="color: #9ca3af; text-align: center; padding: 40px;">
                    No notifications yet. Connect and wait for incoming notifications.
                </p>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let notifications = [];
        let unreadCount = 0;

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            const logClass = `log-${type}`;

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${logClass}">${message}</span>`;

            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateUnreadBadge() {
            const badge = document.getElementById('unreadBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function addNotification(data, isNew = true) {
            notifications.unshift({ ...data, isNew });

            const list = document.getElementById('notificationsList');
            list.innerHTML = '';

            notifications.forEach(noti => {
                const item = document.createElement('div');
                item.className = `notification-item ${noti.isNew ? 'new' : 'read'}`;
                item.innerHTML = `
                    <div class="notification-title">${noti.title || 'Notification'}</div>
                    <div class="notification-subtitle">${noti.subtitle || ''}</div>
                    <div class="notification-message">${noti.message || ''}</div>
                    <div class="notification-meta">
                        <span>Type: ${noti.type || 'N/A'}</span>
                        <span>${noti.timestamp ? new Date(noti.timestamp).toLocaleString() : ''}</span>
                    </div>
                `;
                list.appendChild(item);
            });

            unreadCount = data.unreadCount || unreadCount;
            updateUnreadBadge();
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;

            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            log('🔌 Connecting to server...', 'info');

            socket = io(serverUrl, {
                auth: { token },
                transports: ['websocket', 'polling'],
                reconnection: true
            });

            socket.on('connect', () => {
                log('✅ Connected! Socket ID: ' + socket.id, 'success');
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = 'Connected';
            });

            socket.on('disconnect', (reason) => {
                log('❌ Disconnected: ' + reason, 'error');
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = 'Disconnected';
            });

            socket.on('connect_error', (error) => {
                log('❌ Connection error: ' + error.message, 'error');
            });

            socket.on('joined:notifications', (data) => {
                log('📢 Joined notifications room', 'success');
            });

            socket.on('notification:new', (data) => {
                log('🔔 NEW NOTIFICATION: ' + data.title, 'success');
                addNotification(data, true);

                // Browser notification
                if (Notification.permission === 'granted') {
                    new Notification(data.title, {
                        body: data.subtitle + '\n' + data.message,
                        icon: '🔔'
                    });
                }
            });

            socket.on('notification:read', (data) => {
                log('👁️ Notification read: ID ' + data.notificationId, 'info');
                unreadCount = data.unreadCount;
                updateUnreadBadge();
            });

            socket.on('notification:read-all', (data) => {
                log('👁️ All notifications marked as read', 'info');
                unreadCount = 0;
                updateUnreadBadge();
            });

            socket.on('pong', (data) => {
                const latency = Date.now() - data.timestamp;
                log('🏓 Pong received - Latency: ' + latency + 'ms', 'success');
            });

            socket.on('online-count', (data) => {
                log('📊 Online users: ' + data.count, 'info');
            });

            // Request notification permission
            if (Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                log('👋 Disconnected manually', 'info');
            }
        }

        function joinNotifications() {
            if (!socket || !socket.connected) {
                alert('Please connect first');
                return;
            }
            socket.emit('join:notifications');
            log('📤 Joining notifications room...', 'info');
        }

        function ping() {
            if (!socket || !socket.connected) {
                alert('Please connect first');
                return;
            }
            socket.emit('ping');
            log('🏓 Ping sent...', 'info');
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            log('Logs cleared', 'info');
        }

        function clearNotifications() {
            notifications = [];
            unreadCount = 0;
            document.getElementById('notificationsList').innerHTML = '<p style="color: #9ca3af; text-align: center; padding: 40px;">No notifications</p>';
            updateUnreadBadge();
            log('Notifications cleared', 'info');
        }

        // Initial log
        log('Socket.IO Notification Tester ready', 'success');
        log('Enter your JWT token and server URL, then click Connect', 'info');
    </script>
</body>

</html>
